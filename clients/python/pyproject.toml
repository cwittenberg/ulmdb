[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ulmdb"
version = "0.1.0"
description = "Python client for ULMDB, with ordered bytes and IPv4/IPv6 indexes"
requires-python = ">=3.9"

[tool.setuptools]
packages = ["ulmdb"]

[tool.setuptools.package-data]
ulmdb = ["py.typed"]
