[package]
name = "ulmdb-c"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
sql-batch = []
sql-hash = ["sql-batch", "dep:self_cell"]

[lib]
name = "ulmdb_c"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
ulmdb-platform.workspace = true
ulmdb.workspace = true
ulmdb-storage.workspace = true
libc.workspace = true
sha2.workspace = true
self_cell = { version = "=1.3.0", optional = true }

[dev-dependencies]
ulmdb-kv.workspace = true

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
