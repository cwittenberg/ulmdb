[package]
name = "ulmdb-prefix-strategy-benchmark"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace]

[features]
default = ["scalar"]
scalar = ["ulmdb-prefix/scalar-family"]

[dependencies]
ulmdb-core = { path = "../../../crates/ulmdb-core" }
ulmdb-prefix = { path = "../../../crates/ulmdb-prefix" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1
