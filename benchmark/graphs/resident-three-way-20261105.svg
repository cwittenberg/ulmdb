<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc">
<title id="title">ULMDB, LMDB and SQLite throughput</title>
<desc id="desc">Resident profile. One million keys, ten million reads and one million updates. LMDB loads faster; ULMDB has higher read and update throughput in this comparison.</desc>
<rect width="1000" height="450" fill="white"/>
<g font-family="system-ui, sans-serif" fill="#17212b">
<text x="24" y="31" font-size="21" font-weight="600">ULMDB vs LMDB vs SQLite</text>
<text x="24" y="55" font-size="13">Resident profile · higher operations per second is better</text>
<line x1="260" x2="260" y1="88" y2="420" stroke="#71808c"/>
<text x="260" y="80" text-anchor="middle" font-size="11">0M/s</text>
<line x1="450" x2="450" y1="88" y2="420" stroke="#e5eaf0"/>
<text x="450" y="80" text-anchor="middle" font-size="11">1M/s</text>
<line x1="640" x2="640" y1="88" y2="420" stroke="#e5eaf0"/>
<text x="640" y="80" text-anchor="middle" font-size="11">2M/s</text>
<line x1="830" x2="830" y1="88" y2="420" stroke="#e5eaf0"/>
<text x="830" y="80" text-anchor="middle" font-size="11">3M/s</text>
<text x="24" y="143" font-size="15" font-weight="600">Load</text>
<text x="160" y="115" font-size="12">ULMDB</text>
<rect x="260" y="100" width="265.419" height="20" rx="2" fill="#2875b9"/>
<text x="533.419" y="115" font-size="12">1,396,940/s</text>
<text x="160" y="141" font-size="12">LMDB</text>
<rect x="260" y="126" width="292.553" height="20" rx="2" fill="#4a8570"/>
<text x="560.553" y="141" font-size="12">1,539,753/s</text>
<text x="160" y="167" font-size="12">SQLite</text>
<rect x="260" y="152" width="155.288" height="20" rx="2" fill="#c58235"/>
<text x="423.288" y="167" font-size="12">817,306/s</text>
<text x="24" y="253" font-size="15" font-weight="600">Read</text>
<text x="160" y="225" font-size="12">ULMDB</text>
<rect x="260" y="210" width="527.628" height="20" rx="2" fill="#2875b9"/>
<text x="795.628" y="225" font-size="12">2,776,989/s</text>
<text x="160" y="251" font-size="12">LMDB</text>
<rect x="260" y="236" width="315.455" height="20" rx="2" fill="#4a8570"/>
<text x="583.455" y="251" font-size="12">1,660,288/s</text>
<text x="160" y="277" font-size="12">SQLite</text>
<rect x="260" y="262" width="86.543" height="20" rx="2" fill="#c58235"/>
<text x="354.543" y="277" font-size="12">455,490/s</text>
<text x="24" y="363" font-size="15" font-weight="600">Update</text>
<text x="160" y="335" font-size="12">ULMDB</text>
<rect x="260" y="320" width="27.599" height="20" rx="2" fill="#2875b9"/>
<text x="295.599" y="335" font-size="12">145,257/s</text>
<text x="160" y="361" font-size="12">LMDB</text>
<rect x="260" y="346" width="24.347" height="20" rx="2" fill="#4a8570"/>
<text x="292.347" y="361" font-size="12">128,143/s</text>
<text x="160" y="387" font-size="12">SQLite</text>
<rect x="260" y="372" width="11.067" height="20" rx="2" fill="#c58235"/>
<text x="279.067" y="387" font-size="12">58,247/s</text>
</g>
</svg>
