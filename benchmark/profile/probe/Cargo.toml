[package]
name = "ulmdb-profile-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

# Diagnostic-only executable, outside every production/qualification workspace.
[workspace]

[dependencies]
ulmdb = { path = "../../../crates/ulmdb", features = ["resident-word-search", "resident-single-pass-audit", "resident-private-index", "resident-direct-page-patch", "resident-fused-patch", "resident-prefix-audit-cache", "resident-compact-pages", "resident-scalar-prefix", "resident-metadata-reuse"] }
ulmdb-lmdb-baseline = { path = "../../support/lmdb" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
libc = "=0.2.191"

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1
