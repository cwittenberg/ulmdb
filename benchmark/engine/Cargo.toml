[package]
name = "ulmdb-engine-benchmark"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
build = "build.rs"
[workspace]
[features]
resident = ["ulmdb/resident-word-search", "ulmdb/resident-single-pass-audit", "ulmdb/resident-private-index", "ulmdb/resident-direct-page-patch", "ulmdb/resident-fused-patch", "ulmdb/resident-prefix-audit-cache", "ulmdb/resident-compact-pages", "ulmdb/resident-scalar-prefix", "ulmdb/resident-metadata-reuse"]
[dependencies]
ulmdb = { path = "../../crates/ulmdb" }
ulmdb-lmdb-baseline = { path = "../support/lmdb" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
[build-dependencies]
sha2 = "=0.10.9"
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1
