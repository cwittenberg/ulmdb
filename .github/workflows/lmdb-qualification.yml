name: LMDB qualification

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install explicit host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils strace python3-dev python3-pip python3-venv nodejs npm libnode-dev
          rustup toolchain install 1.94.0 --profile minimal
      - name: Run the same qualification command as local development
        run: python3 clients/lmdb-ulmdb/qualify.py --bootstrap
      - name: Preserve receipts, traces and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lmdb-linux-qualification
          path: target/qualification/runs/
          if-no-files-found: error
